<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | فكس تراك</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <div class="container nav-container">
            <a href="index.html" class="logo">Fix<span>Track</span></a>
            <div class="header-btns">
                <button id="openModalBtn" class="btn btn-primary"><i class="fas fa-plus"></i> طلب جديد</button>
                <button id="logoutBtn" class="btn btn-secondary"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>
    </header>

    <div class="container">
        <div style="margin-bottom: 30px;">
            <h1 style="margin: 0; font-size: 1.8rem;">لوحة التحكم</h1>
            <p id="welcomeText" style="color: var(--gray); margin: 5px 0;"></p>
        </div>
        
        <div class="stats-grid">
            <div class="stat-box"><h3 id="totalBookings">0</h3><p>إجمالي الطلبات</p></div>
            <div class="stat-box"><h3 id="pendingBookings">0</h3><p>قيد المراجعة</p></div>
            <div class="stat-box"><h3 id="progressBookings">0</h3><p>جاري التنفيذ</p></div>
            <div class="stat-box"><h3 id="completedBookings">0</h3><p>مكتملة</p></div>
        </div>

        <div class="card">
            <h3 style="margin-top: 0; margin-bottom: 20px;"><i class="fas fa-tasks"></i> الطلبات الحالية</h3>
            <div id="bookingList"></div>
        </div>
    </div>

    <div id="bookingModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top: 0;">إرسال طلب صيانة جديد</h3>
            <form id="newBookingForm">
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">تفاصيل العطل</label>
                    <textarea id="bookingDetails" rows="4" style="width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box;" required minlength="10"></textarea>
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">الموقع (حي/شارع)</label>
                    <input type="text" id="bookingLocation" style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box;" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">إرسال الطلب الآن</button>
            </form>
            <button onclick="document.getElementById('bookingModal').style.display='none'" style="margin-top: 15px; background: none; border: none; color: var(--gray); cursor: pointer; width: 100%; font-weight: 600;">إلغاء</button>
        </div>
    </div>

    <script src="js/supabase-config.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
